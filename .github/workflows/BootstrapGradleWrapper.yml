name: Bootstrap Gradle Wrapper

on:
  workflow_dispatch:
    inputs:
      gradle_version:
        description: "Gradle version to generate the wrapper for"
        required: false
        default: "8.9"

permissions:
  contents: write

jobs:
  bootstrap-wrapper:
    name: Generate and commit Gradle wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.event.inputs.gradle_version }}
          validate-wrappers: false

      - name: Generate wrapper files
        run: gradle wrapper --gradle-version ${{ github.event.inputs.gradle_version }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Commit and push wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git status
          git diff --cached --quiet && echo "Nothing to commit" || git commit -m "Add Gradle wrapper"
          git push
