name: Extensions CI
 

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
 
env:
  JAVA_VERSION: "17"
 
jobs:

  build-check:
    name: Build & lint extensions
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Detect changed modules
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'src/**' | cut -d/ -f1-3 | sort -u)
            echo "changed<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changed=all" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Lint all extensions
        run: ./gradlew ktlintCheck
        continue-on-error: true # flip off once the 4 new modules are lint-clean
 
      - name: Assemble debug APKs for all extension modules
        run: ./gradlew assembleDebug
 
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: extensions-debug-apks
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 7
          if-no-files-found: warn
 

  release-build:
    name: Build & publish extension release
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
 

      - name: Assemble release APKs for all extension modules
        run: ./gradlew assembleRelease

 
      - name: Collect release APKs
        run: |
          mkdir -p release-out
          find . -path "*/build/outputs/apk/release/*.apk" -exec cp {} release-out/ \;
          ls -la release-out/
 
 
      - name: Upload release APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: extensions-release-apks
          path: release-out/*.apk
          retention-days: 30
 
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
